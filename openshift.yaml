apiVersion: v1
kind: List
items:
# The poker-trainer-secrets Secret is deliberately NOT defined here. It holds
# SECRET_KEY, which signs session cookies and training tokens, so a value
# committed to the repo would be a value everyone has. `make deploy` generates
# a random one on first deploy and leaves it alone afterwards - rotating it
# would log everyone out and invalidate every hand in play.

# --- MongoDB PVC ---
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: mongo-pvc
  spec:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi

# --- MongoDB ---
- apiVersion: v1
  kind: Service
  metadata:
    name: mongodb
  spec:
    ports:
    - port: 27017
      targetPort: 27017
    selector:
      app: mongodb

- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: mongodb
  spec:
    # The PVC is ReadWriteOnce, so the default RollingUpdate deadlocks: it
    # starts the replacement pod before terminating the old one, and the new
    # pod cannot attach a volume the old one still holds. Recreate accepts a
    # few seconds of downtime instead of hanging the rollout indefinitely.
    strategy:
      type: Recreate
    selector:
      matchLabels:
        app: mongodb
    template:
      metadata:
        labels:
          app: mongodb
      spec:
        containers:
        - name: mongodb
          image: docker.io/library/mongo:5.0
          ports:
          - containerPort: 27017
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
          - name: mongo-storage
            mountPath: /data/db
        volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc

# --- Poker App ---
- apiVersion: image.openshift.io/v1
  kind: ImageStream
  metadata:
    name: poker-trainer

- apiVersion: build.openshift.io/v1
  kind: BuildConfig
  metadata:
    name: poker-trainer
  spec:
    source:
      type: Binary
    strategy:
      type: Docker
    output:
      to:
        kind: ImageStreamTag
        name: "poker-trainer:latest"

- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: poker-trainer
    labels:
      app: poker-trainer
    annotations:
      image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"poker-trainer:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"poker-trainer\")].image"}]'
  spec:
    # Training state travels in a signed token rather than a per-process dict,
    # so a hand dealt by one replica can be answered by any other. Before that
    # this had to stay at 1.
    replicas: 2
    selector:
      matchLabels:
        app: poker-trainer
    template:
      metadata:
        labels:
          app: poker-trainer
      spec:
        containers:
        - name: poker-trainer
          image: "poker-trainer:latest"
          ports:
          - containerPort: 8080
          env:
          - name: MONGO_URI
            value: "mongodb://mongodb:27017/poker"
          - name: FLASK_ENV
            value: "production"
          - name: SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: poker-trainer-secrets
                key: secret-key
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          # Liveness must not depend on MongoDB. If it did, a database outage
          # would restart every replica at once and turn a recoverable
          # dependency failure into a self-inflicted restart storm.
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          # Readiness does ping the database, so a pod that cannot serve is
          # taken out of the load balancer instead of answering wrongly.
          # timeoutSeconds exceeds the client's 2s server-selection timeout.
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

- apiVersion: v1
  kind: Service
  metadata:
    name: poker-trainer-web
  spec:
    ports:
    - port: 8080
      targetPort: 8080
    selector:
      app: poker-trainer

- apiVersion: route.openshift.io/v1
  kind: Route
  metadata:
    name: poker-trainer
  spec:
    to:
      kind: Service
      name: poker-trainer-web
    port:
      targetPort: 8080
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
